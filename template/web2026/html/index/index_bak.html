<!DOCTYPE html>
<html>

    <head>
        {include file="public/include"}
        <title>{:unicode_encode($maccms.site_name)}</title>
        <meta name="keywords" content="{:unicode_encode($maccms.site_keywords)}" />
        <meta name="description" content="{:unicode_encode($maccms.site_description)}" />
    </head>

    <body>

        <div class="container">
            <div class="row">
                <div class="stui-pannel">
                    <div class="stui-pannel__hd">
                        {include file="public/header"}
                        
                        <div class="stui-pannel__bd clearfix">
                            <h2 style="color:white;font-weight:bold;font-size:24px;padding-left:5px;">今日最新</h2>
                            <ul class="stui-vodlist clearfix">
                                {maccms:vod by="time" order="desc" num="12"}
                                {include file="module/vodlist"}
                                {/maccms:vod}
                             </ul>
                        </div>
                    </div>
                </div>

                {include file="public/footer"}
            </div>
        </div>

    </body>

</html>
