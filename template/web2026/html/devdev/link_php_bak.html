  function detectRegionByLanguage() {
    const language = navigator.language || "en-US";
    const region = language.split("-")[1] || "";

    if (region === "HK") return "HK";
    if (region === "CN") return "CN";
    if (region === "TW") return "TW";
    if (region === "MO") return "MO";

    // 簡體中文通常來自中國大陸
    if (language === "zh-CN") return "CN";

    // 繁體中文但沒有指定地區
    if (language.startsWith("zh-")) return "HK"; // 假設是香港

    return "OTHER";
  }

  function detectRegionByTimezone() {
    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    if (!timezone) return null;

    if (timezone.includes("Hong_Kong")) return "HK";
    if (timezone.includes("Shanghai") || timezone.includes("Beijing"))
      return "CN";

    return null;
  }
  async function detectRegionByIP() {
    try {
      const response = await fetch("https://ipapi.co/json/");
      const data = await response.json();

      if (data.country === "HK") return "HK";
      if (data.country === "CN") return "CN";
      return data.country || "OTHER";
    } catch (error) {
      console.error("IP檢測失敗:", error);
      return null;
    }
  }

  function detectDevice() {
    // 獲取用戶代理字符串
    const userAgent = navigator.userAgent.toLowerCase();

    // 檢測移動裝置
    const isMobile =
      /iphone|ipod|android|blackberry|opera mini|iemobile|windows phone/i.test(
        userAgent
      );

    // 檢測平板裝置
    const isTablet =
      /ipad|android|tablet|playbook|silk/i.test(userAgent) &&
      !/mobile/i.test(userAgent);

    // 檢測觸控設備
    const isTouchDevice =
      "ontouchstart" in window || navigator.maxTouchPoints > 0;

    // 檢測屏幕尺寸
    const screenWidth = window.screen.width;
    const screenHeight = window.screen.height;

    // 綜合判斷
    let deviceType;
    if (isMobile) {
      deviceType = "mobile";
    } else if (isTablet) {
      deviceType = "tablet";
    } else {
      deviceType = "PC";
    }

    // 返回檢測結果
    return deviceType;
  }

  function showLink() {
    const deviceType = detectDevice();

      //装置为 pc 时使用序号9998 暗链清单
    } else if (deviceType == "PC" || deviceType == "tablet") {

    }
    return linkType;
  }

  function openUrl(type, url) {

  function getLink(linkType) {

  function getShowRoandom(myRatios) {
    let result = false;
    const randomNum = Math.random() * 100;
    if (randomNum < myRatios) {

    }
    return result;
  }
  //tag權重計算
  function getUrlRoandom(urlData) {
    let result = {};
    const randTotal = urlData.reduce((sum, v) => sum + v.weight, 0);
    const randomNum = Math.random() * randTotal;
    let urlRandomNum = 0;
    for (let i = 0; i < urlData.length; i++) {
      urlRandomNum = urlRandomNum + urlData[i].weight;
      if (randomNum < urlRandomNum) {
        result = urlData[i];
        break;
      }
    }
    return result;
  }

  function getClickData() {
    var data = document.cookie
      .split("; ")
      .find((row) => row.startsWith("ad_click_data="));
    if (data) {
      try {
        return JSON.parse(decodeURIComponent(data.split("=")[1]));
      } catch (e) {}
    }
    return {};
  }

  function setClickData(data) {
    const now = new Date();
    const expire = new Date(now);
    expire.setHours(24, 0, 0, 0);
    document.cookie =
      "ad_click_data=" +
      encodeURIComponent(JSON.stringify(data)) +
      "; path=/; expires=" +
      expire.toUTCString();
  }

  function apiJumpSync() {
    var xhr = new XMLHttpRequest();
    xhr.open("POST", "/api.php/link/jump", false);
    xhr.setRequestHeader("Cache-Control", "no-store");
    xhr.send(null);
    if (xhr.status === 200) {
      try {
        var json = JSON.parse(xhr.responseText);
        if (json && json.code === 0 && json.data && json.data.url)
          return json.data;
        throw new Error(json.msg || "jump failed");
      } catch (e) {
        throw e;
      }
    }
    throw new Error("jump failed");
  }

  function checkLinkCookie() {
    const cookies = document.cookie.split(";");
    for (let i = 0; i < cookies.length; i++) {
      const cookie = cookies[i].trim();
      if (cookie.startsWith("lastVisit=")) {
        return cookie.substring("lastVisit=".length, cookie.length);
      }
    }
    return null;
  }

  function setLinkCookie() {
    const now = new Date();
    const expiry = new Date(now.getTime() + 1 * 60 * 60 * 1000); 
    document.cookie = `lastVisit=${now.toISOString()}; expires=${expiry.toUTCString()}; path=/`;
  }
