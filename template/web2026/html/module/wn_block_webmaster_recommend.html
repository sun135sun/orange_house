{if($wn_link_upgrade)}
<div class="wn_block_link wn_block_webmaster_recommend">
    <h4 class="wn_block_title">{:lang('站长推荐')}</h4>
    <div class="wn_block_link_wrapper">
        {maccms:link type="font" order="asc" by="sort" num="9999"}
            {if( $vo.link_sort >= 0 && $vo.link_sort <= 1000)}
                <a class="wn_block_link_item" target="_blank" rel="{$vo.link_rel}" href="{:unicode_encode($vo.link_url)}" style="background-color:{$vo.link_background_color}">
                    <span class="wn_block_link_item_name" style="background-color:{$vo.link_background_color};color:{$vo.link_name_color};">{:unicode_encode($vo.link_name)}</span>
                </a>
            {/if}
        {/maccms:link}
    </div>
</div>
{/if}
