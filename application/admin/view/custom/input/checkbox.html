<div class="layui-form-item">
    <label class="layui-form-label">{$option['text']}</label>
    <div class="layui-input-inline w600">
        {maccms:foreach name="$option[choices]" id="choice_name" key="choice_value"}
        <input type="checkbox" lay-skin="{$option['skin']}" name="param[{$option['name']}][]" value="{$choice_value}" title="{$choice_name}" {if( in_array($choice_value,$config[$option['name']]) )} checked {/if}>
        {/maccms:foreach}
    </div>
    <div class="layui-form-mid layui-word-aux">註意，僅影響wd參數，勾選過多影響性能，建議3個以內</div>
</div>
